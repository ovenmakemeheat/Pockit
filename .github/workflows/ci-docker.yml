name: CI and Docker

on:
  pull_request:
    branches: [lab5, main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://pockit:pockit-ci@localhost:5432/pockit?schema=public
  NODE_ENV: test

jobs:
  test-and-docker:
    name: test-and-docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pockit
          POSTGRES_PASSWORD: pockit-ci
          POSTGRES_DB: pockit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pockit -d pockit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare safe environment examples
        run: |
          cp apps/server/.env.example apps/server/.env
          cp apps/web/.env.example apps/web/.env
          sed -i 's#postgresql://pockit:pockit-local-only@127.0.0.1:5432/pockit#postgresql://pockit:pockit-ci@localhost:5432/pockit#' apps/server/.env

      - name: Generate Prisma Client and environment types
        run: |
          bun run env:generate
          bun run db:generate

      - name: Apply database migrations
        run: bun run db:migrate:deploy

      - name: Run automated tests
        run: bun run test

      - name: Check types and build
        run: |
          bun run check-types
          bun run build

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
