name: Deploy Pockit

on:
  workflow_run:
    workflows: [CI and Docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: pockit
  API_SERVICE: pockit-api
  WEB_SERVICE: pockit-web
  MIGRATION_JOB: pockit-migrate
  SQL_INSTANCE: pockit-pg
  RUNTIME_SERVICE_ACCOUNT: pockit-runner@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: deploy-${{ github.sha }}
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/api:${RELEASE_SHA}"
          docker build -f apps/server/Dockerfile -t "${API_IMAGE}" .
          docker push "${API_IMAGE}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"

      - name: Run database migration job
        run: |
          if gcloud run jobs describe "${MIGRATION_JOB}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            JOB_COMMAND=(gcloud run jobs update "${MIGRATION_JOB}")
          else
            JOB_COMMAND=(gcloud run jobs create "${MIGRATION_JOB}")
          fi
          "${JOB_COMMAND[@]}" \
            --image="${API_IMAGE}" \
            --command=bun \
            --args=run,db:migrate:deploy \
            --set-secrets="DATABASE_URL=pockit-database-url:latest" \
            --set-cloudsql-instances="${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --quiet
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --wait \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --quiet

      - name: Deploy API service
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --image="${API_IMAGE}" \
            --port=3000 \
            --allow-unauthenticated \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0" \
            --set-secrets="DATABASE_URL=pockit-database-url:latest,BETTER_AUTH_SECRET=pockit-auth-secret:latest" \
            --quiet

      - name: Build and push web image
        run: |
          API_URL="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          WEB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/web:${RELEASE_SHA}"
          docker build -f apps/web/Dockerfile --build-arg "VITE_SERVER_URL=${API_URL}" -t "${WEB_IMAGE}" .
          docker push "${WEB_IMAGE}"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy web service
        run: |
          gcloud run deploy "${WEB_SERVICE}" \
            --image="${WEB_IMAGE}" \
            --port=3001 \
            --allow-unauthenticated \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0,SERVER_URL=${API_URL}" \
            --quiet

      - name: Align API trusted origin with web URL
        run: |
          WEB_URL="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          API_URL="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          gcloud run services update "${API_SERVICE}" \
            --update-env-vars="CORS_ORIGIN=${WEB_URL},BETTER_AUTH_URL=${API_URL}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --quiet
          echo "WEB_URL=${WEB_URL}" >> "$GITHUB_ENV"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"

      - name: Smoke test release
        run: |
          curl --fail --show-error --retry 5 --retry-delay 3 "${API_URL}/api/health"
          curl --fail --show-error --retry 5 --retry-delay 3 "${API_URL}/api/ready"
          curl --fail --show-error --retry 5 --retry-delay 3 "${WEB_URL}/"
          echo "Deployed commit: ${RELEASE_SHA}"
