version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    target-branch: staging-1
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/server"
      - "/apps/web"
    target-branch: staging-1
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
