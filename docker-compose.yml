name: Pockit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pockit
      POSTGRES_PASSWORD: pockit-local-only
      POSTGRES_DB: pockit
    ports:
      - "127.0.0.1:${POCKIT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pockit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pockit -d pockit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://pockit:pockit-local-only@postgres:5432/pockit?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env

volumes:
  pockit-postgres-data:
